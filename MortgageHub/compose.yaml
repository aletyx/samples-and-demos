# Mortgage Hub with Docker alone: `docker compose up` from this folder, then
# open http://localhost:8880/app/. No devbox or Flutter needed on the host.
#
# The aityx settings come from the environment, else this folder's .env
# (see .env.example), and reach the API only, never the web app.

services:
  api:
    build: mortgagehub_api
    environment:
      AITYX_API_KEY: ${AITYX_API_KEY:-}
      AITYX_URL: ${AITYX_URL:-}
      ASSUMED_RATE: ${ASSUMED_RATE:-6.5}
      API_PORT: "8881"
      MORTGAGEHUB_BIND_HOST: 0.0.0.0
    # Not published: the web service proxies /api/ to it.
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    # Bound to this host only; set MORTGAGEHUB_BIND_HOST=0.0.0.0 to share it.
    ports:
      - "${MORTGAGEHUB_BIND_HOST:-127.0.0.1}:${FLUTTER_WEB_PORT:-8880}:8080"
    restart: unless-stopped
