name: datyx_dashboard
description: "The datyx dashboard: what the datyx API answers, and every call to it."
publish_to: 'none'

# Overridden by the build scripts (--build-name, --build-number): X.Y.Z
# from the version files and the build time (scripts/version.sh).
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
