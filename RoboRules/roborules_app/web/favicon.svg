<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- RoboRules' favicon, in aityx's style: one flat orange glyph, no background. A tank seen from above: two tracks, a hull, a turret ringed by a gap, and a barrel (the same art as assets/icon/icon.svg, without the dark tile). -->
  <defs>
    <mask id="turret-ring">
      <rect width="320" height="320" fill="#fff"/>
      <circle cx="160" cy="186" r="58" fill="#000"/>
    </mask>
  </defs>
  <g fill="#E36742">
    <g mask="url(#turret-ring)">
      <rect x="28" y="60" width="62" height="228" rx="16"/>
      <rect x="230" y="60" width="62" height="228" rx="16"/>
      <rect x="100" y="84" width="120" height="188" rx="12"/>
    </g>
    <circle cx="160" cy="186" r="44"/>
    <rect x="146" y="14" width="28" height="176" rx="6"/>
  </g>
</svg>
